# Phase 16: identical to simdcgan.yaml except spectral normalisation in the discriminator
# and one-sided label smoothing (decision log §23).
# SimDCGAN: the plain DCGAN plus the Euler loss (scripts/train_gan.py).
# Everything except the `model` name and the `euler` section is identical to dcgan.yaml.

model: simdcgan_sn
beat_type: V                     # S, V or F (override with --beat-type)

processed_dir: data/processed
checkpoints_dir: checkpoints     # checkpoints/<model>/<beat_type>/{best,last}.pt
runs_dir: outputs/runs           # outputs/runs/<model>_<beat_type>/ logs and figures
samplers_path: data/processed/param_samplers.npz   # for the physiology metric (Phase 3)

seed: 0

training:
  iterations: 5000               # discriminator updates (override with --iterations)
  batch_size: 64
  lr: 0.0002
  betas: [0.5, 0.999]
  g_steps_per_d_step: 2          # SimGANs paper: two generator updates per discriminator update
  log_every: 10
  eval_every: 250                # MMD / diversity / copy check against validation beats
  snapshot_every: 500            # fixed-noise samples for the progress figure
  n_eval: 512
  n_snapshot: 16
  # Phase 16 small-class stabilisation (decision log §23):
  discriminator_spectral_norm: true   # spectral norm in D, no batch norm in D
  real_label: 0.9                     # one-sided label smoothing

euler:
  # Weight λ on the per-beat Euler distance (summed over the 215 steps, as in the paper).
  # The paper's text implies λ = 1; the authors' code (a mean over steps) equals λ ≈ 1/215.
  # Chosen by the Phase 5 sweep on V: 0.0047 (≈ 1/215) trains well; 0.03 and 1.0 kept the
  # generator collapsed to a flat line (see docs/decision-log.md).
  weight: 0.0047
  # random: one sampled parameter set per beat (the paper's formula).
  # best_of_k: the smallest distance over k sampled sets (the paper's stated intuition).
  pairing: random
  k: 16
